<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HomeSet Showcase</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Self-playing opener:  a phone running the HomeSet chat sits center stage while illustrated rooms
   cross-fade behind it (a mat at home, a living room, a small home gym), then a title card, then it loops.
   Plans are real HomeSet outputs (evals/cases/saved_plan.json).  One fixed look, not theme-dependent. */
:root {
  --ink: #1F1B2E; --muted: #6B6580; --accent: #5B3FD9; --surface: #FFFFFF; --surface-2: #F4F1FF;
  --calm: #FFF4EC; --calm-line: #F3D6C4;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "Nunito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: #2A2342; color: var(--ink); font-family: var(--body); overflow: hidden; cursor: pointer; }

/* ---------- rooms ---------- */
.stage { position: fixed; inset: 0; }
.scene { position: absolute; inset: 0; opacity: 0; transition: opacity 1.2s ease; overflow: hidden; }
.scene.on { opacity: 1; }
.scene .room { position: absolute; inset: -3%; transform: scale(1); transition: transform 9s linear; }
.scene.on .room { transform: scale(1.05); }
.wall, .floor { position: absolute; left: 0; right: 0; }
.wall { top: 0; height: 64%; }
.floor { bottom: 0; height: 36%; }
.part { position: absolute; }

/* scene 1:  morning, a mat at home */
.s1 .wall { background: linear-gradient(180deg, #FFE3D1, #FCD3BE); }
.s1 .floor { background: repeating-linear-gradient(90deg, #E2BE98 0 9vw, #D9B28A 9vw 9.2vw), #E2BE98; }
.s1 .window { left: 8vw; top: 9vh; width: 22vw; height: 36vh; background: linear-gradient(180deg, #CFE6FF, #F4F9FF);
  border: 1.2vh solid #FFFFFF; border-radius: 1vh; box-shadow: 0 1vh 3vh rgba(0,0,0,.08); }
.s1 .window::before, .s1 .window::after { content: ""; position: absolute; background: #FFFFFF; }
.s1 .window::before { left: 50%; top: 0; bottom: 0; width: 1vh; transform: translateX(-50%); }
.s1 .window::after { top: 50%; left: 0; right: 0; height: 1vh; transform: translateY(-50%); }
.s1 .sunbeam { left: 6vw; top: 30vh; width: 40vw; height: 70vh; background: linear-gradient(160deg, rgba(255,255,255,.45), rgba(255,255,255,0) 70%);
  transform: skewX(-25deg); }
.s1 .mat { left: 6vw; bottom: 9vh; width: 34vw; height: 9vh; background: linear-gradient(180deg, #9C87FF, #7D64EE);
  border-radius: 2vh; transform: perspective(60vh) rotateX(55deg); box-shadow: 0 2vh 2vh rgba(60,40,120,.18); }
.s1 .roll { left: 37vw; bottom: 10vh; width: 4vw; height: 7vh; border-radius: 50%; background: radial-gradient(circle at 50% 50%, #6A50E0 30%, #8A73F5 31%); }
.s1 .pot { right: 9vw; bottom: 30vh; width: 7vw; height: 10vh; background: #E9785B; border-radius: 0 0 1.5vh 1.5vh; }
.s1 .leaf { right: 9.5vw; bottom: 39vh; width: 6vw; height: 16vh; background: radial-gradient(ellipse at 30% 60%, #4E9F7C 40%, transparent 42%),
  radial-gradient(ellipse at 70% 40%, #3F8A6A 40%, transparent 42%), radial-gradient(ellipse at 50% 20%, #5BB08A 38%, transparent 40%); }
.s1 .shelf { right: 6vw; top: 18vh; width: 16vw; height: 1.2vh; background: #C99A6E; border-radius: .5vh; }
.s1 .book { top: 11vh; width: 1.6vw; height: 7vh; border-radius: .4vh; }

/* scene 2:  living room, no gear */
.s2 .wall { background: linear-gradient(180deg, #EDE7FF, #E2D9FB); }
.s2 .floor { background: #C9B79F; }
.s2 .rug { left: 10vw; right: 10vw; bottom: 4vh; height: 18vh; background: repeating-linear-gradient(90deg, #F2C9B2 0 3vw, #EDBBA0 3vw 6vw);
  border-radius: 50%; transform: perspective(60vh) rotateX(60deg); }
.s2 .couch { left: 3vw; bottom: 24vh; width: 30vw; height: 18vh; }
.s2 .couch .back { position: absolute; left: 2vw; right: 2vw; top: 0; height: 11vh; background: #5E4BB8; border-radius: 3vh 3vh 1vh 1vh; }
.s2 .couch .seat { position: absolute; left: 0; right: 0; bottom: 2vh; height: 8vh; background: #6F5BD0; border-radius: 2vh; }
.s2 .couch .arm { position: absolute; bottom: 2vh; width: 4vw; height: 12vh; background: #5644AA; border-radius: 2vh; }
.s2 .couch .arm.l { left: -1vw; } .s2 .couch .arm.r { right: -1vw; }
.s2 .couch .pillow { position: absolute; top: 4vh; width: 6vw; height: 8vh; background: #FFC9A8; border-radius: 1.5vh; transform: rotate(-8deg); left: 4vw; }
.s2 .frame { top: 10vh; width: 9vw; height: 14vh; background: #FFFFFF; border: .8vh solid #2F2A44; border-radius: .6vh; }
.s2 .frame.a { left: 8vw; } .s2 .frame.b { left: 19vw; top: 13vh; width: 7vw; height: 10vh; }
.s2 .frame.a::after { content: ""; position: absolute; inset: 1vh; background: linear-gradient(160deg, #FFB892, #9C87FF); }
.s2 .frame.b::after { content: ""; position: absolute; inset: 1vh; background: radial-gradient(circle at 50% 60%, #5BB08A 40%, #DFF3E8 42%); }
.s2 .lamp-pole { right: 12vw; bottom: 24vh; width: .6vw; height: 40vh; background: #2F2A44; }
.s2 .lamp-shade { right: 9.5vw; top: 14vh; width: 6vw; height: 9vh; background: #FFD7A8; clip-path: polygon(20% 0, 80% 0, 100% 100%, 0 100%); }
.s2 .glow { right: 4vw; top: 6vh; width: 18vw; height: 30vh; background: radial-gradient(circle, rgba(255,220,170,.55), transparent 65%); }
.s2 .window { right: 22vw; top: 8vh; width: 0; height: 0; }

/* scene 3:  small home gym */
.s3 .wall { background: linear-gradient(180deg, #D9D3EC, #CBC3E3); }
.s3 .floor { background: repeating-linear-gradient(90deg, #3F3A55 0 12vw, #37324B 12vw 24vw); }
.s3 .mirror { left: 6vw; top: 8vh; width: 20vw; height: 44vh; background: linear-gradient(135deg, #F4F1FF 0%, #E3DCF8 45%, #F7F5FF 55%, #E1DAF6 100%);
  border: 1vh solid #2F2A44; border-radius: 1vh; }
.s3 .upright { bottom: 22vh; width: 1.1vw; height: 50vh; background: #2F2A44; border-radius: .4vh; }
.s3 .upright.a { right: 9vw; } .s3 .upright.b { right: 25vw; }
.s3 .bar { right: 6vw; top: 26vh; width: 23vw; height: 1vh; background: #8C86A3; border-radius: .5vh; }
.s3 .plate { top: 20vh; width: 2vw; height: 13vh; background: #5B3FD9; border-radius: .6vh; }
.s3 .plate.a { right: 6.5vw; } .s3 .plate.b { right: 27vw; }
.s3 .bench { left: 30vw; bottom: 18vh; width: 16vw; height: 3vh; background: #E9785B; border-radius: 1vh; }
.s3 .bench-leg { bottom: 12vh; width: 1vw; height: 6vh; background: #2F2A44; }
.s3 .bench-leg.a { left: 32vw; } .s3 .bench-leg.b { left: 43vw; }
.s3 .kb { right: 34vw; bottom: 9vh; width: 6vw; height: 6vw; border-radius: 50%; background: #2F2A44; }
.s3 .kb::before { content: ""; position: absolute; left: 1vw; right: 1vw; top: -2.4vw; height: 3.4vw; border: 1vw solid #2F2A44; border-bottom: 0; border-radius: 3vw 3vw 0 0; }
.s3 .db { left: 12vw; bottom: 8vh; width: 10vw; height: 2vh; background: #8C86A3; border-radius: 1vh; }
.s3 .db::before, .s3 .db::after { content: ""; position: absolute; top: -2vh; width: 2.4vw; height: 6vh; background: #E9785B; border-radius: .8vh; }
.s3 .db::before { left: -.5vw; } .s3 .db::after { right: -.5vw; }

/* ---------- phone ---------- */
.phone-wrap { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 5;
  height: min(80vh, 720px); aspect-ratio: 9 / 19.5; filter: drop-shadow(0 3vh 5vh rgba(30, 20, 70, .35));
  container-type: inline-size; }
.phone { position: absolute; inset: 0; background: #16131F; border-radius: 13% / 6%; padding: 4.2%; }
.screen { position: relative; height: 100%; border-radius: 10% / 4.7%; overflow: hidden;
  background: linear-gradient(160deg, #EDE7FF, #FFE9DD); display: flex; flex-direction: column;
  font-size: 3.9cqw; }  /* text scales with the phone, so it reads the same at any screen size */
.notch { position: absolute; left: 50%; top: 1.4%; width: 30%; height: 3.2%; transform: translateX(-50%); background: #16131F; border-radius: 99px; z-index: 2; }
.bar-top { padding: 12% 7% 3%; display: flex; justify-content: space-between; align-items: center; }
.brand { font-family: var(--display); font-weight: 800; font-size: 1.6em; }
.brand span { color: var(--accent); }
.status { font-size: .85em; color: var(--muted); font-weight: 700; white-space: nowrap; }
.chat { flex: 1; padding: 2% 6%; display: flex; flex-direction: column; gap: .8em; overflow: hidden; }
.row { display: flex; animation: rise .35s ease; }
.row.me { justify-content: flex-end; }
.bubble { max-width: 86%; padding: .7em .95em; border-radius: 1.2em; box-shadow: 0 .4em 1.2em rgba(91,63,217,.12); line-height: 1.35; }
.me .bubble { background: var(--accent); color: #fff; font-weight: 700; border-bottom-right-radius: .35em; }
.bot .bubble { background: var(--surface); border-bottom-left-radius: .35em; }
.bubble.wide { max-width: 100%; width: 100%; }
.bubble.handoff { background: var(--calm); border: 1.5px solid var(--calm-line); box-shadow: none; }
.bubble h3 { font-family: var(--display); font-weight: 800; font-size: 1.15em; margin: 0 0 .5em; }
.ex { list-style: none; margin: 0; padding: 0; display: grid; gap: .35em; }
.ex li { display: grid; grid-template-columns: 1.3em minmax(0,1fr) auto; gap: .5em; align-items: center; background: var(--surface-2);
  border-radius: .7em; padding: .45em .6em; opacity: 0; animation: rise .35s ease forwards; }
.num { font-family: var(--display); font-weight: 800; color: var(--accent); }
.name { font-weight: 700; min-width: 0; }
.sets { font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
.total { margin-top: .6em; display: flex; gap: .4em; align-items: baseline; }
.total b { font-family: var(--display); font-weight: 800; font-size: 1.7em; }
.total span, .safety { color: var(--muted); font-size: .85em; }
.safety { margin: .3em 0 0; }
.typing { display: inline-flex; gap: .3em; padding: .2em 0; }
.typing i { width: .5em; height: .5em; border-radius: 50%; background: var(--muted); animation: blink 1s infinite; }
.typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
.input { margin: 3% 5% 8%; background: #fff; border-radius: 99px; padding: .75em 1em; display: flex; justify-content: space-between;
  align-items: center; box-shadow: 0 .4em 1.2em rgba(91,63,217,.12); min-height: 2.9em; }
.input .typed { color: var(--ink); font-weight: 600; white-space: nowrap; overflow: hidden; }
.input .typed:empty::before { content: "Tell me your minutes, gear, focus"; color: var(--muted); font-weight: 400; }
.input .send { background: var(--accent); color: #fff; font-weight: 800; border-radius: 99px; padding: .3em .8em; font-size: .9em; }
.caret { display: inline-block; width: 1px; height: 1em; background: var(--accent); vertical-align: -2px; animation: blink 1s infinite; }

/* ---------- captions and title ---------- */
.caption { position: fixed; z-index: 6; left: 50%; bottom: 3vh; transform: translateX(-50%);
  background: rgba(31, 27, 46, .78); color: #fff; font-family: var(--display); font-weight: 600; font-size: clamp(14px, 2.4vh, 22px);
  padding: .5em 1.1em; border-radius: 99px; white-space: nowrap; transition: opacity .6s ease; }
.label { position: fixed; z-index: 6; right: max(16px, 2vw); top: 2vh; color: #fff; background: rgba(31,27,46,.55);
  font-size: 12px; font-weight: 700; padding: .35em .8em; border-radius: 99px; }
.title { position: fixed; inset: 0; z-index: 10; display: grid; place-content: center; text-align: center; gap: 1.6vh;
  background: linear-gradient(160deg, #EDE7FF, #FFE9DD); opacity: 0; pointer-events: none; transition: opacity 1s ease; padding: 0 16px; }
.title.on { opacity: 1; }
.title h1 { font-family: var(--display); font-weight: 800; font-size: clamp(48px, 13vh, 150px); margin: 0; letter-spacing: -.02em; line-height: .95; }
.title h1 span { color: var(--accent); }
.title p { margin: 0; font-size: clamp(16px, 3vh, 30px); font-weight: 700; }
.title small { font-size: clamp(13px, 2vh, 18px); color: var(--muted); font-weight: 700; }
.hint { position: fixed; z-index: 11; left: 50%; top: 2vh; transform: translateX(-50%); color: #fff; background: rgba(31,27,46,.55);
  font-size: 12px; font-weight: 700; padding: .35em .8em; border-radius: 99px; transition: opacity .6s; }

@keyframes rise { from { transform: translateY(.6em); opacity: 0 } to { transform: none; opacity: 1 } }
@keyframes blink { 0%, 100% { opacity: .25 } 50% { opacity: 1 } }
@media (prefers-reduced-motion: reduce) {
  .scene .room, .scene.on .room { transform: none; transition: none; }
  .row, .ex li { animation: none; opacity: 1; }
}
@media (max-aspect-ratio: 3/4) { .caption { white-space: normal; text-align: center; width: 90vw; } }
</style>
</head>
<body>
<div class="stage" aria-hidden="true">
  <div class="scene s1"><div class="room">
    <div class="wall"></div><div class="floor"></div>
    <div class="part window"></div><div class="part sunbeam"></div>
    <div class="part shelf"></div>
    <div class="part book" style="right:18vw;background:#9C87FF"></div>
    <div class="part book" style="right:16.2vw;background:#E9785B;height:6vh;top:12vh"></div>
    <div class="part book" style="right:14.4vw;background:#4E9F7C"></div>
    <div class="part pot"></div><div class="part leaf"></div>
    <div class="part mat"></div><div class="part roll"></div>
  </div></div>
  <div class="scene s2"><div class="room">
    <div class="wall"></div><div class="floor"></div>
    <div class="part frame a"></div><div class="part frame b"></div>
    <div class="part glow"></div><div class="part lamp-shade"></div><div class="part lamp-pole"></div>
    <div class="part rug"></div>
    <div class="part couch"><div class="back"></div><div class="seat"></div><div class="arm l"></div><div class="arm r"></div><div class="pillow"></div></div>
  </div></div>
  <div class="scene s3"><div class="room">
    <div class="wall"></div><div class="floor"></div>
    <div class="part mirror"></div>
    <div class="part upright a"></div><div class="part upright b"></div>
    <div class="part bar"></div><div class="part plate a"></div><div class="part plate b"></div>
    <div class="part bench"></div><div class="part bench-leg a"></div><div class="part bench-leg b"></div>
    <div class="part kb"></div><div class="part db"></div>
  </div></div>
</div>

<div class="phone-wrap" aria-label="HomeSet running on a phone">
  <div class="phone"><div class="screen">
    <div class="notch"></div>
    <div class="bar-top"><div class="brand">HomeSet<span>.</span></div><div class="status" id="status">At home</div></div>
    <div class="chat" id="chat"></div>
    <div class="input"><span class="typed" id="typed"></span><span class="send">Send</span></div>
  </div></div>
</div>

<div class="caption" id="caption">A mat and fifteen minutes at home</div>
<div class="label">Sample plans from real HomeSet runs</div>
<div class="hint" id="hint">Click anywhere for full screen</div>

<div class="title" id="title">
  <h1>HomeSet<span>.</span></h1>
  <p>One sentence in. One plan out.</p>
  <small>Valerie Zandoli &amp; Yadan Taino · Pursuit Cycle 2</small>
</div>

<script>
// Real outputs:  evals/cases/saved_plan.json (s02 and s01), and the fixed hand-off sentence (homeset/messages.py).
const SCENES = [
  { cls: "s1", status: "At home", caption: "A mat and fifteen minutes at home",
    ask: "I have 15 minutes and a mat.",
    plan: { header: "15 min, mat, full body (assumed)", total: "14.3", ex: [
      ["Bodyweight Squat HD", "2 × 10"], ["knee push-ups", "2 × 8"], ["Superman", "2 × 10"],
      ["Crunches", "2 × 10"], ["Hip Raise, Lying", "2 × 10"] ] } },
  { cls: "s2", status: "Living room", caption: "No gear? The living room works",
    ask: "I have 20 minutes and no equipment.",
    plan: { header: "20 min, nothing, full body (assumed)", total: "20.4", ex: [
      ["Bodyweight Squat HD", "3 × 10"], ["Push-Up", "3 × 8"], ["Bird Dog", "3 × 10"],
      ["Single Leg Glute Bridge", "3 × 10"], ["Arm Raises (T/Y/I)", "3 × 10"] ] } },
  { cls: "s3", status: "Home gym", caption: "Pain comes first: no plan, a referral",
    ask: "My knee hurts. 15 minutes, legs.",
    handoff: "I cannot plan workouts around pain, injuries, or medical conditions.  Please talk to a doctor or physical therapist first." },
];
const SAFETY = "Stop if anything hurts.  For pain or injury, see a doctor or physical therapist.";
const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const $ = id => document.getElementById(id);
const chat = $("chat"), typed = $("typed");
const sleep = ms => new Promise(r => setTimeout(r, reduce ? Math.min(ms, 400) : ms));
const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
function row(who, bubble) { const r = el("div", "row " + who); r.appendChild(bubble); chat.appendChild(r); return r; }

async function type(text) {
  typed.textContent = "";
  const caret = el("span", "caret");
  for (const ch of text) { typed.textContent += ch; typed.appendChild(caret); await sleep(45); caret.remove(); }
  await sleep(350);
  typed.textContent = "";
}

function planBubble(p) {
  const b = el("div", "bubble wide");
  b.appendChild(el("h3", null, "Your plan: " + p.header));
  const ol = el("ol", "ex");
  p.ex.forEach(([n, s], i) => {
    const li = el("li"); li.style.animationDelay = (i * 0.18) + "s";
    li.append(el("span", "num", String(i + 1)), el("span", "name", n), el("span", "sets", s));
    ol.appendChild(li);
  });
  b.appendChild(ol);
  const t = el("div", "total"); t.append(el("b", null, p.total), el("span", null, "min total (calculated)"));
  b.append(t, el("p", "safety", SAFETY));
  return b;
}

async function playScene(s) {
  document.querySelectorAll(".scene").forEach(n => n.classList.toggle("on", n.classList.contains(s.cls)));
  $("status").textContent = s.status;
  $("caption").textContent = s.caption;
  chat.replaceChildren();
  await sleep(900);
  await type(s.ask);
  row("me", el("div", "bubble", s.ask));
  await sleep(400);
  const dots = el("span", "typing"); dots.append(el("i"), el("i"), el("i"));
  const wait = row("bot", (() => { const b = el("div", "bubble"); b.appendChild(dots); return b; })());
  await sleep(s.handoff ? 900 : 1500);
  wait.remove();
  row("bot", s.handoff ? el("div", "bubble handoff", s.handoff) : planBubble(s.plan));
  await sleep(s.handoff ? 3800 : 4600);
}

async function loop() {
  for (;;) {
    $("title").classList.remove("on");
    $("caption").style.opacity = 1;
    for (const s of SCENES) await playScene(s);
    $("caption").style.opacity = 0;
    $("title").classList.add("on");
    await sleep(4500);
  }
}

document.addEventListener("click", () => {
  $("hint").style.opacity = 0;
  const d = document.documentElement;
  if (!document.fullscreenElement && d.requestFullscreen) d.requestFullscreen().catch(() => {});
});
setTimeout(() => { $("hint").style.opacity = 0; }, 5000);
loop();
</script>
</body>
</html>
