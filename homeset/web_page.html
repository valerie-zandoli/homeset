<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HomeSet</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* One centered chat column on a soft lilac-to-peach wash; HomeSet replies arrive as bubbles that hold a plan card. */
:root {
  --bg-a: #EDE7FF; --bg-b: #FFE9DD; --surface: #FFFFFF; --surface-2: #F4F1FF;
  --ink: #1F1B2E; --muted: #6B6580; --accent: #5B3FD9; --accent-ink: #FFFFFF;
  --line: #E4DEF7; --calm: #FFF4EC; --calm-line: #F3D6C4; --warn: #FFF7D6; --warn-line: #E9D58A;
  --shadow: 0 6px 20px rgba(91, 63, 217, .12);
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "Nunito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg-a: #1C1631; --bg-b: #2A1A22; --surface: #2A2342; --surface-2: #352C55;
    --ink: #F3F0FF; --muted: #B6AED3; --accent: #9C87FF; --accent-ink: #1C1631;
    --line: #43396A; --calm: #3A2630; --calm-line: #6B4352; --warn: #3A3420; --warn-line: #6E6334;
    --shadow: 0 6px 20px rgba(0,0,0,.35); color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: linear-gradient(160deg, var(--bg-a), var(--bg-b)) fixed; background-color: var(--bg-a);
  color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45; }
.app { max-width: 480px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column;
  padding: 18px max(16px, env(safe-area-inset-right, 0px)) 14px max(16px, env(safe-area-inset-left, 0px)); }
header { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-family: var(--display); font-weight: 800; font-size: 24px; letter-spacing: -.01em; }
.brand span { color: var(--accent); }
.tag { font-size: 12px; color: var(--muted); font-weight: 700; }
.chat { flex: 1; display: flex; flex-direction: column; gap: 12px; padding-block: 18px; }
.row { display: flex; animation: rise .25s ease; }
.row.me { justify-content: flex-end; }
.bubble { max-width: 86%; min-width: 0; padding: 11px 14px; border-radius: 18px; box-shadow: var(--shadow);
  overflow-wrap: anywhere; white-space: pre-line; }
.me .bubble { background: var(--accent); color: var(--accent-ink); border-bottom-right-radius: 5px; font-weight: 600; }
.bot .bubble { background: var(--surface); border-bottom-left-radius: 5px; }
.bubble.wide { max-width: 100%; width: 100%; white-space: normal; }
.bubble.handoff { background: var(--calm); border: 1.5px solid var(--calm-line); box-shadow: none; }
.bubble.error { background: var(--warn); border: 1.5px solid var(--warn-line); box-shadow: none; }
.bubble h3 { font-family: var(--display); font-weight: 800; font-size: 18px; margin: 0 0 8px; text-wrap: balance; }
.ex { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.ex li { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 8px; align-items: center;
  background: var(--surface-2); border-radius: 12px; padding: 8px 10px; }
.num { font-family: var(--display); font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums; }
.name { font-weight: 700; min-width: 0; }
.name small { display: block; font-weight: 600; color: var(--muted); font-size: 12px; }
.sets { font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
.total { display: flex; align-items: baseline; gap: 6px; margin-top: 12px; }
.total b { font-family: var(--display); font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; }
.total span { color: var(--muted); font-size: 13px; }
.safety { font-size: 13px; color: var(--muted); margin: 6px 0 0; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
button { font: inherit; font-weight: 800; font-size: 13px; cursor: pointer; border-radius: 99px; padding: 7px 14px;
  border: 1.5px solid var(--accent); background: var(--accent); color: var(--accent-ink); }
button.ghost { background: transparent; color: var(--accent); }
button:disabled { opacity: .45; cursor: default; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.confirm { margin-top: 12px; padding: 10px 12px; border-radius: 12px; border: 1.5px dashed var(--accent); font-size: 14px; }
.confirm p { margin: 0 0 6px; }
.confirm pre { margin: 0 0 8px; padding: 8px; background: var(--surface-2); border-radius: 8px; font-size: 12px;
  white-space: pre-wrap; overflow-wrap: anywhere; max-height: 160px; overflow: auto; }
.typing { display: inline-flex; gap: 4px; padding: 4px 2px; }
.typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: blink 1s infinite; }
.typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
.prompts { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
.prompts button { background: var(--surface); color: var(--ink); border-color: var(--line); font-weight: 700; }
form { display: flex; gap: 8px; background: var(--surface); border-radius: 99px; padding: 6px 6px 6px 16px; box-shadow: var(--shadow); }
input { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--ink); font: inherit; outline: none; }
input::placeholder { color: var(--muted); }
footer { font-size: 12px; color: var(--muted); text-align: center; margin-top: 10px; }
@keyframes blink { 0%, 100% { opacity: .3 } 50% { opacity: 1 } }
@keyframes rise { from { transform: translateY(6px); opacity: .6 } to { transform: none; opacity: 1 } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">HomeSet<span>.</span></div>
    <div class="tag">At-home workout planner</div>
  </header>

  <main class="chat" id="chat" aria-live="polite">
    <div class="row bot"><div class="bubble">Hi! Tell me how many minutes you have, what gear is around, and what you want to work on. I'll build you a plan.</div></div>
  </main>

  <div class="prompts" id="prompts">
    <button type="button" data-q="I have 15 minutes and a mat. Legs.">15 min, a mat, legs</button>
    <button type="button" data-q="I have 20 minutes and a pair of dumbbells. Upper body.">20 min, dumbbells, upper body</button>
    <button type="button" data-swap="1">Swap the first exercise</button>
  </div>
  <form id="ask">
    <label for="q" hidden>Your workout request</label>
    <input id="q" autocomplete="off" maxlength="500" placeholder="e.g. 15 minutes, a mat. Legs.">
    <button type="submit" id="send">Send</button>
  </form>
  <footer>HomeSet is not medical advice. Stop if anything hurts.</footer>
</div>

<script>
const chat = document.getElementById("chat");
const sendBtn = document.getElementById("send");
let busy = false;
let fresh = true;  // the first request after the page loads starts a new conversation

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;  // replies are shown as text, never as HTML
  return n;
}
function addRow(who, bubble) {
  const row = el("div", "row " + who);
  row.appendChild(bubble);
  chat.appendChild(row);
  window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
  return row;
}
async function post(url, body) {
  const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) });
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}

function planBubble(reply) {
  const p = reply.plan;
  const b = el("div", "bubble wide");
  if (!p) { b.style.whiteSpace = "pre-line"; b.textContent = reply.text; }
  else {
    b.appendChild(el("h3", null, "Your plan: " + p.header));
    const list = el("ol", "ex");
    p.exercises.forEach((e, i) => {
      const li = el("li");
      li.appendChild(el("span", "num", String(i + 1)));
      const name = el("span", "name", e.name);
      name.appendChild(el("small", null, e.equipment_text + " · rest " + e.rest_seconds + " s"));
      li.appendChild(name);
      li.appendChild(el("span", "sets", e.sets + " × " + e.reps));
      list.appendChild(li);
    });
    b.appendChild(list);
    const total = el("div", "total");
    total.appendChild(el("b", null, String(p.total)));
    total.appendChild(el("span", null, "min total (calculated)"));
    b.appendChild(total);
    b.appendChild(el("p", "safety", p.safety));
  }
  const actions = el("div", "actions");
  const save = el("button", null, "Save plan");
  save.type = "button";
  save.addEventListener("click", () => offerSave(b, save, reply.text));
  actions.appendChild(save);
  b.appendChild(actions);
  return b;
}

// The checkpoint:  show the saved plan next to this one, and save only after "Yes, save".
async function offerSave(bubble, saveBtn, planText) {
  saveBtn.disabled = true;
  let res;
  try { res = await post("/api/save/propose", { plan: planText }); }
  catch (e) { saveBtn.disabled = false; return bubble.appendChild(el("p", "safety", "Could not reach HomeSet. Is it still running?")); }
  if (!res.ok) { saveBtn.disabled = false; return bubble.appendChild(el("p", "safety", res.text)); }
  const box = el("div", "confirm");
  box.appendChild(el("p", null, res.old ? "This replaces your saved plan from " + res.old.saved_at + ":" : "You have no saved plan yet."));
  if (res.old) box.appendChild(el("pre", null, res.old.plan));
  box.appendChild(el("p", null, "Save this plan?"));
  const row = el("div", "actions");
  const yes = el("button", null, "Yes, save"); yes.type = "button";
  const no = el("button", "ghost", "No"); no.type = "button";
  row.append(yes, no); box.appendChild(row); bubble.appendChild(box);
  const answer = async (a) => {
    yes.disabled = no.disabled = true;
    let r;
    try { r = await post("/api/save/answer", { id: res.id, answer: a }); }
    catch (e) { r = { saved: false, text: "Could not reach HomeSet. Nothing was saved." }; }
    box.replaceChildren(el("p", null, r.text));
    if (!r.saved) saveBtn.disabled = false;
  };
  yes.addEventListener("click", () => answer("yes"));
  no.addEventListener("click", () => answer("no"));
}

function showReply(reply) {
  if (reply.kind === "plan") return addRow("bot", planBubble(reply));
  const cls = reply.kind === "handoff" ? "bubble handoff" : reply.kind === "error" ? "bubble error" : "bubble";
  const bubble = el("div", cls, reply.text);
  if (reply.screen) {  // the health question:  one tap answers "none";  anything typed works too
    const none = el("button", null, "None of these"); none.type = "button";
    none.addEventListener("click", () => { none.disabled = true; run("none", "/api/ask", { message: "none" }); });
    const actions = el("div", "actions"); actions.appendChild(none); bubble.appendChild(actions);
  }
  addRow("bot", bubble);
}

async function run(userText, url, body) {
  if (busy) return;
  busy = true; sendBtn.disabled = true;
  addRow("me", el("div", "bubble", userText));
  const wait = el("div", "bubble");
  const dots = el("span", "typing"); dots.setAttribute("aria-label", "HomeSet is building your plan");
  dots.append(el("i"), el("i"), el("i")); wait.appendChild(dots);
  const waitRow = addRow("bot", wait);
  try { const reply = await post(url, { ...body, fresh }); fresh = false; showReply(reply); }
  catch (e) { showReply({ kind: "error", text: "Could not reach HomeSet. Is it still running in the terminal?" }); }
  finally { waitRow.remove(); busy = false; sendBtn.disabled = false; }
}

document.getElementById("ask").addEventListener("submit", e => {
  e.preventDefault();
  const q = document.getElementById("q");
  const text = q.value.trim();
  if (!text) return;
  q.value = "";
  run(text, "/api/ask", { message: text });
});
document.getElementById("prompts").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.swap) run("Swap the first exercise.", "/api/swap", {});
  else if (b.dataset.q) run(b.dataset.q, "/api/ask", { message: b.dataset.q });
});
</script>
</body>
</html>
